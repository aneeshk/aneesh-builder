<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, Aneesh</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #03040c;
        color: #f8f7ff;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #51317c55 0, transparent 30%),
          radial-gradient(circle at 80% 75%, #0c6f8d44 0, transparent 32%),
          #03040c;
      }

      .stars,
      .stars::before,
      .stars::after {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          radial-gradient(circle at 8% 18%, #fff 0 1px, transparent 1.5px),
          radial-gradient(circle at 22% 72%, #fff 0 1px, transparent 1.5px),
          radial-gradient(circle at 38% 32%, #b9dfff 0 1px, transparent 1.5px),
          radial-gradient(circle at 58% 82%, #fff 0 1px, transparent 1.5px),
          radial-gradient(circle at 73% 16%, #d9c7ff 0 1px, transparent 1.5px),
          radial-gradient(circle at 91% 58%, #fff 0 1px, transparent 1.5px);
        background-size: 270px 250px;
      }

      .stars::before {
        opacity: 0.45;
        transform: rotate(21deg) scale(1.25);
      }

      .stars::after {
        opacity: 0.2;
        transform: rotate(-17deg) scale(1.5);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(90vw, 720px);
        padding: clamp(3rem, 9vw, 6rem) 2rem;
        text-align: center;
        border: 1px solid #ffffff1f;
        border-radius: 2rem;
        background: linear-gradient(145deg, #ffffff12, #ffffff05);
        box-shadow: 0 24px 100px #000a, inset 0 1px #ffffff1f;
        backdrop-filter: blur(14px);
      }

      main::before {
        position: absolute;
        width: 6rem;
        height: 6rem;
        top: -3rem;
        left: calc(50% - 3rem);
        border-radius: 50%;
        content: "";
        background: linear-gradient(145deg, #e4d6ff, #7852cf 55%, #25133d);
        box-shadow: -12px -8px 30px #ffffff30 inset, 0 0 70px #9f78ff66;
      }

      p {
        margin: 0 0 1rem;
        color: #b9b4d0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 9vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 0.95;
        background: linear-gradient(110deg, #fff 20%, #c8b6ff 55%, #8de8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      @media (prefers-reduced-motion: no-preference) {
        main::before { animation: float 5s ease-in-out infinite; }

        @keyframes float {
          50% { transform: translateY(-10px); }
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <main>
      <p>Greetings from the cosmos</p>
      <h1>Hello, Aneesh</h1>
    </main>
  </body>
</html>
